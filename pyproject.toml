[project]
name = "memoire-fedsubgroup"
version = "0.1.0"
description = "Apprentissage federe medical : personnalisation par sous-groupe demographique vs par client"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "wfdb>=4.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Torch build CUDA (cu126) pour exploiter la RTX 4070 Ti Super.
# Index explicite : seul torch passe par le canal PyTorch, le reste reste sur PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
